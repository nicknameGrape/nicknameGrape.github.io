<html>
<head>
	<link rel="icon" type="image/png" href="/favicon.png">
	<style>
		body {
			margin: 0;
			touch-action: none;
			display: flex;
			flex-direction: column;
		}
		#points {
			height: 20%;
			width: 100%;
			display: flex;
			text-align: center;
		}
		#avg {
			background: pink;
			color: white;
			height: 100%;
			width: 20%;
		}
		#total {
			background: purple;
			color: white;
			height: 100%;
			width: 40%;
		}
		#toAdd {
			color: purple;
			height: 100%;
			width: 40%;
		}
		#game {
			width: 100%;
			height: 80%;
			display: flex;
			flex-direction: row;
		}
		#map {
			background: snow;
			width: 70%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#hint {
			background: lavender;
			width: 30%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
	</style>
</head>
<body>
	<div id="points">
		<div id="avg"></div>
		<div id="total"></div>
		<div id="toAdd"></div>
	</div>
	<div id="game">
		<div id="map"></div>
		<div id="hint"></div>
	</div>
<script data-main="touch_the_sign_main.js" src="../js/require.js">
</script>
</body>
</html>
