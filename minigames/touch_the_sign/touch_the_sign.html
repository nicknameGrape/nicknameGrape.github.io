<html>
<head>
	<link rel="icon" type="image/png" href="/favicon.png">
	<style>
		body {
			margin: 0;
			touch-action: none;
			display: grid;
			grid-template-rows: 15vh 85vh;
		}
		#points {
			display: flex;
			text-align: center;
		}
		#avg {
			background: pink;
			color: white;
			width: 20vw;
		}
		#total {
			background: purple;
			color: white;
			width: 40vw;
		}
		#toAdd {
			color: purple;
			width: 40vw;
		}
		#game {
			height: 85vh;
			display: flex;
			flex-direction: row;
		}
		#map {
			background: snow;
			width: 70%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#hint {
			background: orange;
			width: 30%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
	</style>
</head>
<body>
	<div id="points">
		<div id="avg"></div>
		<div id="total"></div>
		<div id="toAdd"></div>
	</div>
	<div id="game">
		<div id="map"></div>
		<div id="hint"></div>
	</div>
<script src="touch_the_sign_main.js" type="module">
</script>
</body>
</html>
