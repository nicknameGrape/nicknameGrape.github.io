<!DOCTYPE html>
<html>
<head>
	<link rel="icon" href="/favicon.png"/>
	<meta charset="utf-8">
	<style>
input[type=radio] {
	display: none;
}
label {
	display: flex;
	align-items: end;
	justify-content: center;
	gap: 5px;
	background: lightblue;
	padding: 5px;
	font-size: 14pt;
	border: 5px lightblue outset;
	border-radius: 10px;
}
#p1 {
}
#p1wrapper {
	display: grid;
	grid-template-columns: 80vh 20vh;
	grid-template-rows: auto auto auto;
}
#p1prompt {
	grid-area: 1/1/2/3;
}
#p1personality {
	grid-area: 2/2/3/3;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}
#p1personalityPhoto {
	width: calc(15vh);
	object-fit: contain;
}
#p1personalityName {
	text-align: center;
	font-size: 16pt;
}
#p1month {
	grid-area: 2/1/3/2;
	display: grid;
	grid-template-columns: auto auto auto;
	grid-template-rows: auto auto auto auto;
	gap: 10px;
	margin: 10px;
	margin-top: 30px;
}
.month:checked + label {
	background: lime;
	border-color: lime;
}
.jp {
	color: gray;
}
#p1date {
	grid-area: 3/1/4/3;
	display: grid;
	grid-template-columns: repeat(7, auto);
	gap: 10px;
	margin: 10px;
}
.date:checked + label {
	background: lime;
	border-color: lime;
}
#p2 {
}
#p2wrapper {
}
#p2personality {
	display: grid;
	grid-template-columns: repeat(3, 30vh);
	grid-template-rows: repeat(5, auto);
	align-items: center;
	justify-content: center;
	font-size: 24pt;
	font-weight: bold;
	margin: 10px;
}
#p2personalityPhoto {
	grid-area: 1/1/4/2;
	width: 30vh;
	object-fit: contain;
}
#p2personalityMonth {
	grid-area: 1/2/2/3;
	width: 30vh;
	object-fit: contain;
	text-align: center;
	align-self: end;
}
#p2personalityMonthGuess {
	grid-area: 1/3/2/4;
	border: thick dotted gray;
	align-self: end;
}
#p2personalityPronunciation {
	grid-area: 2/2/3/3;
	width: 30vh;
	object-fit: contain;
	text-align: center;
	font-size: 14pt;
	font-weight: normal;
}
#p2personalityDate {
	grid-area: 3/2/4/3;
	width: 30vh;
	object-fit: contain;
	text-align: center;
}
#p2personalityDateGuess {
	grid-area: 3/3/4/4;
	border: thick dotted gray;
	align-self: start;
}
#p2personalityName {
	grid-area: 4/1/5/3;
}
#p2personalityNameJapanese {
	grid-area: 5/1/6/3;
}
	</style>
</head>

	</div>

<script type="module">
	import Split_Screen from "../2p_split_screen.mjs";
	import HatDraw from "../../js_modules/HatDraw.mjs";
	import famous_birthdays from "./famous_birthdays.mjs";
	const GAME = new Split_Screen(document.getElementById("p1"), document.getElementById("p2"));
	const hd = new HatDraw(famous_birthdays);
	const pronunciation_guide = {
		"January": "ジャニュアリー (1月)",
		"February": "フェブラリー (2月)",
		"March": "マーチ (3月)",
		"April": "エイプリル (4月)",
		"May": "メイ (5月)",
		"June": "ジューン (6月)",
		"July": "ジュライ (7月)",
		"August": "オーガスト (8月)",
		"September": "セプテンバー (9月)",
		"October": "オクトーバー (10月)",
		"November": "ノーヴェンバー (11月)",
		"December": "ディセンバー (12月)"
	}

	class Quiz {
		constructor() {
			let personality = hd.drawOne();
			document.getElementById("p1").style.background = "";
			document.getElementById("p2").style.background = "";
			document.getElementById("p1personalityPhoto").src = personality.photo;
			document.getElementById("p1personalityName").innerHTML = personality.name;
			document.getElementById("p2personalityPhoto").src = personality.photo;
			document.getElementById("p2personalityName").innerHTML = personality.name;
			document.getElementById("p2personalityMonth").innerHTML = personality.birth_month;
			document.getElementById("p2personalityPronunciation").innerHTML = pronunciation_guide[personality.birth_month];
			document.getElementById("p2personalityDate").innerHTML = personality.birth_date;
			document.getElementById("p2personalityMonthGuess").innerHTML = "";
			document.getElementById("p2personalityDateGuess").innerHTML = "";
			Array.from(document.getElementsByName("months")).forEach(function (monthButton) {
				monthButton.checked = false;
			})
			Array.from(document.getElementsByName("dates")).forEach(function (dateButton) {
				dateButton.checked = false;
			})
			this.answerMonth = personality.birth_month;
			this.answerDate = personality.birth_date;
			this.guessMonth = null;
			this.guessDate = null;
		}
		check () {
			console.log(this.answerMonth, this.guessMonth, this.answerDate, this.guessDate);
			if (this.guessMonth !== null) {document.getElementById("p2personalityMonthGuess").innerHTML = this.guessMonth;}
			if (this.guessDate !== null) {document.getElementById("p2personalityDateGuess").innerHTML = this.guessDate;}
			if (this.answerMonth === this.guessMonth && this.answerDate === this.guessDate) {
				console.log("CORRECT");
				document.getElementById("p1").style.background = "lime";
				document.getElementById("p2").style.background = "lime";
				setTimeout(function () {
					quiz = new Quiz();
					GAME.swap();
				}, 1000);
			} else {
				console.log("NOT YET");
			}
		}
	}

	Array.from(document.getElementsByName("months")).forEach(function (monthButton) {
		monthButton.addEventListener("change", function () {
			quiz.guessMonth = this.value;
			quiz.check()
		});
	});
	Array.from(document.getElementsByName("dates")).forEach(function (dateButton) {
		dateButton.addEventListener("change", function () {
			quiz.guessDate = this.value;
			quiz.check()
		});
	});
	let quiz = new Quiz();
</script>
