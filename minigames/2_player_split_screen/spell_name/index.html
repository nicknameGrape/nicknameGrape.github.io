<script type="module">
	import Split_Screen from "../2p_split_screen.mjs";
	const GAME = new Split_Screen(document.getElementById("p1"), document.getElementById("p2"));
	const inputName = document.getElementById("inputName");
	const mirror = document.getElementById("mirror");
	let isInputAllowed = true;
	let points = 0;
	window.addEventListener("keydown", function (ev) {
		if (ev.key === " ") {

		}
	});

	const NAMES_HIRAGANA = ['あい', 'あいこ', 'あけみ', 'あきひろ', 'あきこ', 'あきお', 'あきら', 'あさこ', 'あさみ', 'あつこ', 'あつし', 'あや', 'あやこ', 'あゆみ', 'ちえ', 'ちえこ', 'ちひろ', 'ちかこ', 'だいすけ', 'えいじ', 'えみ', 'えみこ', 'えり', 'えりこ', 'えつこ', 'ふみこ', 'はるか', 'ひであき', 'ひでき', 'ひでお', 'ひでゆき', 'ひろあき', 'ひろき', 'ひろこ', 'ひろみ', 'ひろし', 'ひろゆき', 'ひさこ', 'ひとみ', 'ひとし', 'いくこ', 'いさお', 'いずみ', 'じゅん', 'じゅにち', 'じゅんこ', 'かな', 'かなこ', 'かおり', 'かおる', 'かよこ', 'かずえ', 'かずひこ', 'かずひろ', 'かずこ', 'かずみ', 'かずお', 'かずや', 'けい', 'けいいち', 'けいこ', 'けいすけ', 'けん', 'けにち', 'けんじ', 'けんたろ', 'きみこ', 'きよし', 'こいち', 'こじ', 'くみこ', 'きょこ', 'まい', 'まいこ', 'まき', 'まきこ', 'まこと', 'まみ', 'まなぶ', 'まり', 'まりこ', 'まさあき', 'まさひこ', 'まさひろ', 'まさき', 'まさこ', 'まさみ', 'まさのり', 'まさお', 'まさる', 'まさし', 'まさと', 'まさや', 'まさゆき', 'まゆみ', 'めぐみ', 'みちこ', 'みどり', 'みえこ', 'みほ', 'みか', 'みき', 'みきこ', 'みなこ', 'みのる', 'みつこ', 'みわ', 'みよこ', 'みゆき', 'なおき', 'なおこ', 'なおみ', 'なつこ', 'のぶこ', 'のりこ', 'のりお', 'おさむ', 'れいこ', 'りえ', 'りか', 'りさ', 'りょ', 'りょこ', 'さちこ', 'さおり', 'さとみ', 'さとる', 'さとし', 'さやか', 'さゆり', 'せいじ', 'せつこ', 'しげる', 'しにち', 'しんじ', 'しょこ', 'ただし', 'たかひろ', 'たかこ', 'たかし', 'たかゆき', 'たけお', 'たけし', 'たくや', 'たつや', 'てつお', 'てつや', 'ともひろ', 'ともこ', 'ともみ', 'ともゆき', 'とる', 'としこ', 'としお', 'としゆき', 'つとむ', 'つよし', 'わたる', 'やすひろ', 'やすこ', 'やすお', 'やすし', 'よいち', 'よこ', 'よしあき', 'よしえ', 'よしひこ', 'よしひろ', 'よしこ', 'よしみ', 'よしのり', 'よしお', 'よしゆき', 'よすけ', 'ゆ', 'ゆじ', 'ゆか', 'ゆかり', 'ゆき', 'ゆきえ', 'ゆきこ', 'ゆきお', 'ゆこ', 'ゆみ', 'ゆみこ', 'ゆり', 'ゆりこ', 'ゆすけ', 'ゆたか', 'ゆうき']
	let nameEnglish;
	function newName() {
		let rIndex= Math.floor(Math.random()*NAMES.length);
		nameEnglish = NAMES[rIndex].toUpperCase();
		let nameJapanese = NAMES_HIRAGANA[rIndex];
		let spanNameEnglish = document.getElementById("nameEnglish");
		let spanNameJapanese = document.getElementById("nameJapanese");
		spanNameEnglish.innerHTML = nameEnglish;
		spanNameJapanese.innerHTML = nameJapanese;
		document.getElementById("inputName").value = "";
		document.getElementById("mirror").value = "";
		inputName.style.background = "";
		mirror.style.background = "";
		isInputAllowed = true;
	}
	Array.from(document.getElementsByClassName("key")).forEach(function (button) {
		button.addEventListener("click", function (ev) {
			if (isInputAllowed) {
				inputName.value += this.innerHTML;
				inputName.value = inputName.value.toUpperCase();
				mirror.value = inputName.value;
				if (inputName.value === nameEnglish.toUpperCase()) {
					inputName.style.background = "lime";
					mirror.style.background = "lime";
					isInputAllowed = false;
					points += 1;
					Array.from(document.getElementsByClassName("pointValue")).forEach(span => span.innerHTML = points);
					setTimeout(function () {
						newName();
						GAME.swap();
					}, 2000);
				} else {
					inputName.style.background = "";
					mirror.style.background = "";
				};
			}
		});
	});
	document.getElementById("spellerBackspace").addEventListener("click", function () {
		if (isInputAllowed) {
			inputName.value = inputName.value.slice(0, -1);
			mirror.value = inputName.value;
		}
	});
	document.getElementById("namerBackspace").addEventListener("click", function () {
		if (isInputAllowed) {
			inputName.value = inputName.value.slice(0, -1);
			mirror.value = inputName.value;
		}
	});
	newName();
