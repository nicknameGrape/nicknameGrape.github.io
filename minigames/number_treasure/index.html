<html>
<head>
	<style>
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100vw;
			height: 100vh;
			margin:0;
			background: blue;
		}
		#grid {
			display: grid;
			grid-template-columns: repeat(7, 11vw);
			grid-template-rows: repeat(3, 11vw);
			gap: 4vw 2vw;
			box-sizing: border-box;
			margin: 5%;
		}
		.item {
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 10vh;
			background: sandybrown;
			border-radius: 40%;
			background-image: url("../image_library/images/palm_tree_fpvov6av.png");
			background-repeat: no-repeat;
			background-size: 7vh;
			background-position: bottom 60% right 15%;
		}
		img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			align-items: center;
			justify-content: center;
			background: sandybrown;
			border-radius: 40%;
		}
	</style>
</head>
<body>
	<div id="grid">
		<div class="item">1</div>
		<div class="item">2</div>
		<div class="item">3</div>
		<div class="item">4</div>
		<div class="item">5</div>
		<div class="item">6</div>
		<div class="item">7</div>
		<div class="item">8</div>
		<div class="item">9</div>
		<div class="item">10</div>
		<div class="item">11</div>
		<div class="item">12</div>
		<div class="item">13</div>
		<div class="item">14</div>
		<div class="item">15</div>
		<div class="item">16</div>
		<div class="item">17</div>
		<div class="item">18</div>
		<div class="item">19</div>
		<div class="item">20</div>
	</div>
<script type="module" src="main_number_treasure_20.mjs"></script>
</body>
</html>
