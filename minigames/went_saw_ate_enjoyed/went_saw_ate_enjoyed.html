	<head>

		<meta charset="UTF-8">
		<link rel="icon" type="image/png" href="/favicon.png">
	<style>
		body {
			display: grid;
			grid-template-rows: 20vh 30vh 50vh;
			grid-template-columns: 30vw 70vw;
			grid-template-areas:
				"picture jp"
				"picture en"
				"buttons buttons";
			background: teal;
			margin:0;
			font-family: sans-serif;
			touch-action: none;
		}
		#jp {
			grid-area: jp;
			display: flex;
			justify-content: center;
			align-items: center;
			background: tan;
			font-size: 8vh;
		}
		#en {
			grid-area: en;
			display: flex;
			justify-content: center;
			align-items: center;
			background: white;
			font-size: 10vh;
		}
		#picture {
			grid-area: picture;
			display: flex;
			align-items: center;
			justify-content: center;
			background: white;
		}
		#picture img {
			width: 30vw;
			height: 40vh;
			object-fit: contain;
		}
		#buttons {
			grid-area: buttons;
			display: flex;
			justify-content: space-around;
			align-items: center;
			background: orange;
		}
		#buttons button {
			font-size: 10vh;
		}
	</style>
	<script src="js/HatDraw.js"></script>
	<script src="js/shuffle.js"></script>
	<script type="module" src="went_saw_ate_enjoyed_main.js"></script>
</head>
<body>
	<div id="jp"></div>
	<div id="en"></div>
	<div id="picture"></div>
	<div id="buttons"></div>
</body>
