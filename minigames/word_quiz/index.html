<!DOCTYPE html>
	<meta charset="utf-8">
	<head>
		<link rel="stylesheet" href="https://unpkg.com/keyboard-css@1.2.4/dist/css/main.min.css" />
		<style>
@font-face {
    font-family: 'MEXT';
    src: url('mext.otf') format("opentype");
}
body {
	user-select: none;
	margin-left: 30px;
	margin-right: 30px;
	overflow-y: scroll;
}
#top {
	display: grid;
	grid-template-columns: repeat(3, auto);
	grid-template-rows: repeat(2, auto);
	align-items: center;
	justify-content: start;
	gap: 10px 20px;
	margin: 0px 0px 10px 0px;
}
#top h1 {
	margin: 0px;
}
#date {
	justify-self: end;
	grid-area: 2/1/3/2;
}
#date::before {
	content: "DATE: ";
	color: gray;
}
#top input {
	margin: 5px;
}
#top label {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 10px;
	border: thick pink outset;
	border-radius: 10px;
	padding: 10px;
	background: pink;
	grid-row-start: 1;
	grid-row-end: 3;
	width: 20vw;
	font-size: large;
}
#top label:has(input:checked) {
	border-style: inset;
	font-weight: bold;
}
.report {
	display: grid;
	grid-template-columns: repeat(2, auto);
	align-items: start;
	justify-content: center;
	gap: 10px;
	font-size: medium;
	font-weight: normal;
}
.attempts::before {
	content: "ATTEMPTS: ";
	color: gray;
}
.attempts {
}
#points::before {
	content: "POINTS: ";
	color: gray;
}
#points {
}
.accuracy::before {
	content: "ACCURACY: ";
	color: gray;
}
#accuracy {
}
#score::before {
	content: "SCORE: ";
	color: gray;
}
#score {
}
.speaker {
	display: flex;
	align-items: center;
	justify-content: end;
	height: 100%;
	width: 1.2em;
	aspect-ratio: 1/1;
	font-size: inherit;
	color: gray;
}
#seeWordChoosePicture {
	display: flex;
	flex-direction: column;
	align-items: center;
	height: 50vh;
	margin-bottom: 10px;
}
#word {
	display: flex;
	justify-content: space-between;
	font-family: "MEXT", sans-serif;
	font-size: 10vh;
	font-weight: bold;
	align-items: center;
	background: gray;
	color: white;
	width: 100%;
}
#seeWord {
	padding-left: 10px;
	padding-right: 10px;
	height: 15vh;
	position: relative;
	top: 10px;
}
#pictures {
	display: grid;
	grid-template-rows: repeat(2, auto);
	grid-template-columns: repeat(4, auto);
	justify-content: center;
	gap: 10px;
	margin-top: 10px;
}
#pictures button {height: 100%; padding: 10px; box-sizing: border-box;}
#pictures button img {height: 20vh; max-width: 20vw; object-fit: contain;}
#seePictureChooseWord {
	display: flex;
	align-items: center;
	height: 50vh;
	margin-bottom: 10px;
}
#wrapper {
	display: grid;
	grid-template-columns: 40vw auto;
	gap: 10px;
	align-items: center;
	height: 40vh;
}
#picture {
	justify-self: end;
	display: flex;
	align-items: center;
	justify-content: space-between;
	font-size: 10vh;
	height: 40vh;
	width: 40vw;
	font-weight: bold;
	background: gray;
}
#picture img {
	height: 35vh;
	max-width: 25vw;
	object-fit: contain;
}
#words {
	display: grid;
	grid-template-columns: auto auto;
	grid-template-rows: repeat(4, auto);
	grid-auto-flow: column;
	align-items: center;
	justify-content: start;
	gap: 10px;
}
#words button {
	font-size: 6vh;
	font-family: "MEXT", sans-serif;
}
kbd {
	justify-self: center;
}
#missed {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
}
.missed {
	display: flex;
	gap: 10px;
	align-items: end;
	padding: 5px;
	/*border: thin gray dashed;*/
}
.missed img {
	height: 9vh;
	object-fit: contain;
}
.missed span {
	font-size: 32pt;
	font-family: "MEXT", sans-serif;
}
		</style>
	</head>
	<body>
		<div id="top">
			<h1>Word Quiz</h1>
			<div id="date"></div>
			<label for="modeSeeWordChoosePicture">
				<div>
					<input id="modeSeeWordChoosePicture" type="radio" name="mode" value="seeWordChoosePicture"></input>
					Word &rarr; Picture
				</div>
				<div class="report">
					<div id="attemptsSeeWordChoosePicture" class="attempts">0</div>
					<div id="accuracySeeWordChoosePicture" class="accuracy">0%</div>
				</div>
			</label>
			<label for="modeSeePictureChooseWord">
				<div>
				<input id="modeSeePictureChooseWord" type="radio" name="mode" value="seePictureChooseWord" checked></input>
				Picture &rarr; Word
				</div>
				<div class="report">
					<div id="attemptsSeePictureChooseWord" class="attempts">0</div>
					<div id="accuracySeePictureChooseWord" class="accuracy">0%</div>
				</div>
			</label>
		</div>
		<div id="seeWordChoosePicture">
			<div id="word">
				<button class="speaker" style="transform: scale(-1,1);">🕨</button>
				<div id="seeWord" translate="no"></div>
				<button class="speaker">🕨</button>
			</div>
			<div id="pictures"></div>
		</div>
		<div id="seePictureChooseWord">
			<div id="wrapper">
				<div id="picture">
					<button class="speaker" style="transform: scale(-1,1);">🕨</button>
					<img id="seePicture"/>
					<button class="speaker">🕨</button>
				</div>
				<div id="words"></div>
			</div>
		</div>
		<div id="missed">
			<h2 id="missedTitle">Missed:&nbsp;</h2>
		</div>
	</body>
	<script type="module">
import il from "../image_library/image_library.mjs";
import HatDraw from "../js_modules/HatDraw.mjs";
import shuffle from "../js_modules/shuffle.mjs";
import Loader from "../js_modules/Loader.mjs";

class QuizWord2Picture {
	constructor() {
		let answer = hd.drawOne();
		let choices = [];
		choices.push(answer);
		choices.push(hd.drawOne());
		choices.push(hd.drawOne());
		choices.push(hd.drawOne());
		shuffle(choices);
		this.loader = new Loader("/image_library/images/");
		//this.loader = new Loader("https://nicknamegrape.github.io/image_library/images/");
		this.word = answer.text;
		this.image = this.loader.newImageAsset(answer.src, this.onload.bind(this));
		this.buttons = choices.map(function (ilo, index) {
			const button = document.createElement("button");
			const img = this.loader.newImageAsset(ilo.src, this.onload.bind(this));
			button.value = ilo.text;
			button.addEventListener("click", checkGuessPicture);
			button.appendChild(img);
			return button;
		}.bind(this));
		this.tries = 0;
		this.complete = false;
	}
	attempt() {
		let divPictures = document.getElementById("pictures");
		//display the new word
		document.getElementById("seeWord").style.color = "";
		document.getElementById("seeWord").style.background = "";
		document.getElementById("seeWord").innerHTML = quiz.word;
		//remove old buttons
		while (divPictures.firstChild) {divPictures.removeChild(divPictures.firstChild);}
		//make new buttons
		this.buttons.forEach(button => divPictures.appendChild(button));
		//and kbd elements to show the shortcut for each button
		["A", "S", "D", "F"].forEach(function (letter) {
			let kbd = document.createElement("kbd");
			kbd.innerHTML = letter;
			kbd.classList.add("kbc-button");
			divPictures.appendChild(kbd);
		});
		//show this div, hide the other
		document.getElementById("seeWordChoosePicture").style.display = "flex";
		document.getElementById("seePictureChooseWord").style.display = "none";
	}
	onload() {
		if (this === quiz && this.loader.assetsLoaded) {
			this.attempt();
		}
	}
}

class QuizPicture2Word {
	constructor() {
		let answer = hd.drawOne();
		let choices = [];
		choices.push(answer);
		choices.push(hd.drawOne());
		choices.push(hd.drawOne());
		choices.push(hd.drawOne());
		shuffle(choices);
		//this.loader = new Loader("/image_library/images/");
		this.loader = new Loader("https://nicknamegrape.github.io/image_library/images/");
		this.word = answer.text;
		this.image = this.loader.newImageAsset(answer.src, this.onload.bind(this));
		this.image.id="seePicture";
		this.buttons = choices.map(function (ilo, index) {
			const button = document.createElement("button");
			button.value = ilo.text;
			button.innerHTML = ilo.text;
			button.addEventListener("click", checkGuessPicture);
			return button;
		});
		this.tries = 0;
		this.complete = false;
	}
	attempt() {
		let pictureElement = document.getElementById("picture");
		let divWords = document.getElementById("words");
		//display the new picture
		pictureElement.style.background = "";
		pictureElement.removeChild(document.getElementById("seePicture"));
		pictureElement.insertBefore(quiz.image, pictureElement.children[1]);
		//remove old buttons
		while (divWords.firstChild) {divWords.removeChild(divWords.firstChild);}
		//kbd elements to show the shortcut for each button
		["A", "S", "D", "F"].forEach(function (letter) {
			let kbd = document.createElement("kbd");
			kbd.innerHTML = letter;
			kbd.classList.add("kbc-button");
			divWords.appendChild(kbd);
		});
		//make new buttons
		this.buttons.forEach(button => divWords.appendChild(button));
		//show this div, hide the other
		document.getElementById("seeWordChoosePicture").style.display = "none";
		document.getElementById("seePictureChooseWord").style.display = "flex";
	}
	onload() {
		if (this === quiz && this.loader.assetsLoaded) {
			this.attempt();
		}
	}
}

function makeReportPicture() {
	if (attemptsSeeWordChoosePicture > 0) {
		document.getElementById("attemptsSeeWordChoosePicture").innerHTML = attemptsSeeWordChoosePicture;
		document.getElementById("accuracySeeWordChoosePicture").innerHTML = parseInt(pointsSeeWordChoosePicture/(attemptsSeeWordChoosePicture*4)*100)+"%";
	}
	if (attemptsSeePictureChooseWord > 0) {
		document.getElementById("attemptsSeePictureChooseWord").innerHTML = attemptsSeePictureChooseWord;
		document.getElementById("accuracySeePictureChooseWord").innerHTML = parseInt(pointsSeePictureChooseWord/(attemptsSeePictureChooseWord*4)*100)+"%";
	}
}

function checkGuessPicture() {
	if (this.value === quiz.word) {
		quiz.complete = true;
		this.style.background = "lime";
		document.getElementById("seeWord").style.color = "lime";
		this.removeEventListener("click", checkGuessPicture);
		quiz.buttons.forEach(button => button.removeEventListener("click", checkGuessPicture));
		let award = 4-quiz.tries; //will award 4 points if they got it right on the first try
		if (mode === "seeWordChoosePicture") {
			attemptsSeeWordChoosePicture += 1;
			pointsSeeWordChoosePicture += award;
		} else if (mode === "seePictureChooseWord") {
			attemptsSeePictureChooseWord += 1;
			pointsSeePictureChooseWord += award;
		}
		//update report
		makeReportPicture();
		//add an element to #missed if they didn't get it right on the first guess
		if (quiz.tries > 0) {
			let button = document.createElement("button");
			let img = document.createElement("img");
			let text = document.createElement("span");
			let speaker = document.createElement("span");
			speaker.innerHTML = "🕨";
			speaker.classList.add("speaker");
			button.value = quiz.word;
			button.classList.add("missed");
			img.src = quiz.image.src;
			text.innerHTML = quiz.word;//🕪
			button.appendChild(img);
			button.appendChild(text);
			button.appendChild(speaker);
			button.addEventListener("click", function (ev) {
				speak(this.value, this);
			});
			document.getElementById("missed").appendChild(button);
		}
		setTimeout(function () {
			quiz = nextQuiz;
			if (mode === "seeWordChoosePicture") {
				nextQuiz = new QuizWord2Picture();
			} else if (mode === "seePictureChooseWord") {
				nextQuiz = new QuizPicture2Word();
			}
			quiz.attempt();
		}, 1000);
	} else {
		this.style.background = "red";
		this.removeEventListener("click", checkGuessPicture);
		quiz.tries += 1;
	}
}

function speak(text, element) {
	Array.from(element.getElementsByClassName("speaker")).forEach(el => el.innerHTML = "🕪");
	synth.cancel();
	const utterThis = new SpeechSynthesisUtterance(text);
	utterThis.voice = hdVoices.drawOne();
	utterThis.addEventListener("end", function () {
			Array.from(element.getElementsByClassName("speaker")).forEach(el => el.innerHTML = "🕨");
			});
	//utterThis.lang = "en-US";
	synth.speak(utterThis);
}

function createHdVoices() {
	let voices = synth.getVoices();
	let voiceChoices = voices.filter(v => v.lang.includes("en"));
	hdVoices = new HatDraw(voiceChoices);
}

const tag = new URLSearchParams(window.location.search).get("tag");
console.log(tag);
let hd;
if (tag !== null) {
	let il_filtered = il.filter(o => o.tags.includes(tag));
	console.log(il_filtered);
	hd = new HatDraw(il_filtered);
} else {
	hd = new HatDraw(il);
}
let hdVoices;
let quiz = null;
let nextQuiz = null;
let attemptsSeeWordChoosePicture = 0; //tracks how many quizzes they have attempted
let pointsSeeWordChoosePicture = 0;
let attemptsSeePictureChooseWord = 0; //tracks how many quizzes they have attempted
let pointsSeePictureChooseWord = 0;
let mode = Array.from(document.getElementsByName("mode")).filter(el => el.checked)[0].value;

//speech
const synth = window.speechSynthesis;
createHdVoices();
if (synth.getVoices().length == 0) {
	synth.addEventListener("voiceschanged", createHdVoices);
} else {
	createHdVoices();
}
document.getElementById("word").addEventListener("pointerdown", function (ev) {
	speak(document.getElementById("seeWord").innerHTML, this);
});
document.getElementById("picture").addEventListener("pointerdown", function (ev) {
	speak(quiz.word, this);
});

let today = new Date();
document.getElementById("date").innerHTML = today.getFullYear()+"年"+(today.getMonth()+1)+"月"+today.getDate()+"日";
window.addEventListener("keydown", function (ev) {
	if (ev.key.toUpperCase() === "A") {
		quiz.buttons[0].click();
	} else if (ev.key.toUpperCase() === "S") {
		quiz.buttons[1].click();
	} else if (ev.key.toUpperCase() === "D") {
		quiz.buttons[2].click();
	} else if (ev.key.toUpperCase() === "F") {
		quiz.buttons[3].click();
	}
});

function setup() {
		if (mode === "seeWordChoosePicture") {
			quiz = new QuizWord2Picture();
			nextQuiz = new QuizWord2Picture();
			document.getElementById("seePictureChooseWord").style.visiblity = "none";
		} else if (mode === "seePictureChooseWord") {
			quiz = new QuizPicture2Word();
			nextQuiz = new QuizPicture2Word();
			document.getElementById("seeWordChoosePicture").style.visiblity = "none";
		}
}

Array.from(document.getElementsByName("mode")).forEach(el => el.addEventListener("input", function (ev) {
		mode = this.value;
		setup();
	})
);

setup();
	</script>
</html>
