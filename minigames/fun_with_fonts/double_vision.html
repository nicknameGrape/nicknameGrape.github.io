function setup() {
	console.log("setup");
	let alphabet = Array.from("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
	answer = hdUppercase.drawOne();
	alphabet.splice(alphabet.indexOf(answer), 1);
	let tilesUpper = alphabet.slice(0, 12);
	let tilesLower = alphabet.slice(12,23).map(c => c.toLowerCase());
	let tiles = tilesUpper.concat(tilesLower);
	tiles.push(answer, answer.toLowerCase());
	shuffle(tiles);
	console.log(answer, tiles);
	document.querySelectorAll(".letter").forEach(el => el.remove());
	tiles.forEach(function (c) {
		let tile = document.createElement("span");
		tile.classList.add("letter");
		tile.innerHTML = c;
		tile.addEventListener("pointerdown", checkLetter);
		document.getElementById("letters").appendChild(tile);
	});
}

//loadFonts();
function checkLetter() {
	if (this.innerHTML.toUpperCase() !== answer) {
		this.style.background = "red";
	}
	revealAnswer();
}

function revealAnswer() {
	document.querySelectorAll(".letter").forEach(function (el) {
		if (el.innerHTML.toUpperCase() === answer) {
			el.style.background = "lime";
		}
	});
	setTimeout(setup, 2000);
}

window.addEventListener("keypress", function (ev) {
	if (ev.key === "n") {
		setup();
	}
});

setup();
