	<script type="module">
import HatDraw from "../js_modules/HatDraw.mjs";

class Quiz {
	constructor() {
		this.completed = false; //needed to prevent queueing up multiple new Quizzes
		let pronoun = hdPronouns.drawOne();
		let verb = hdVerbs.drawOne();
		//mix it between names and pronouns
		let keepAsPronoun = Math.random() > .5 ? true : false;
		if (keepAsPronoun) {
			this.subject = pronoun;
		} else {
			if (
				pronoun === "I" ||
				pronoun === "You"
			) {
				this.subject = pronoun;
			} else if (
				pronoun === "He" ||
				pronoun === "She"
			) {
				this.subject = hdNames.drawOne();
			} else if (pronoun === "We") {
				this.subject = hdNames.drawOne() + " and I";
			} else if (pronoun === "They") {
				this.subject = hdNames.drawOne() + " and " + hdNames.drawOne();
			}
		}
		//define answer
		if (pronoun === "He" || pronoun === "She") {
			this.answer = verb.inflected;
		} else {
			this.answer = verb.uninflected;
		}
		//define verb root
		let verb_root = "";
		let index = 0;
		while (index < verb.uninflected.length) {
			if (verb.uninflected[index] === verb.inflected[index]) {
				verb_root += verb.uninflected[verb_root.length];
			} else {
				break;
			}
			index += 1;
		}
		this.verb_root = verb_root;
		//define starting value of quiz_box
		//the player may need to erase an unnecessary "s", or add an "s", or add a missing "e" before the "s" in some few cases like "watches" and "goes"
		if (Math.random() > .5) {
			inputTextbox.value = "";
		} else {
			inputTextbox.value = "s";
		}
		correctionTextbox.value = this.answer.slice(this.verb_root.length, this.answer.length);
		inputTextbox.focus();
		//present Quiz
		if (
			verb.with_frequency &&
			Math.random() > .5 //sometimes add frequency when a verb allows for it
		) {
			let frequency = hdFrequency.drawOne();
			spanStart.innerHTML = this.subject + " " + frequency + " " + verb_root;
			spanEnd.innerHTML = verb.tail + ".";
			correctionStart.innerHTML = this.subject + " " + frequency + " " + verb_root;
			correctionEnd.innerHTML = verb.tail + ".";
		} else {
			spanStart.innerHTML = this.subject + " " + verb_root;
			spanEnd.innerHTML = verb.tail + ".";
			correctionStart.innerHTML = this.subject + " " + verb_root;
			correctionEnd.innerHTML = verb.tail + ".";
		}
		divQuiz.style.background = "";
		divCorrection.style.display = "none";
		//advance playCount
		playCount += 1;
	}
	isGood() {
		if (this.verb_root + inputTextbox.value === this.answer) {
			points += 1;
			divQuiz.style.background = "lime";
			this.completed = true;
			return true;
		} else {
			quiz_box.style.background = "red";
			setTimeout(function () {
				quiz_box.style.background = "";
			}, 100);
			divCorrection.style.display = "flex";
		//	points -= 1;
		}
		spanScore.innerHTML = points;
		spanAttempts.innerHTML = playCount;
		let rgbGreen = Math.floor(255*points/playCount);
		divTop.style.background = "rgb("+(255-rgbGreen)+","+rgbGreen+",0)";
		console.log(points, playCount);
	}
}
