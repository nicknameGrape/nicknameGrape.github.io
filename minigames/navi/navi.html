<!DOCTYPE html>
	<head>
		<title>スーパーナビ</title>
		<style>
body {
	display: grid;
	grid-template-columns: 45vw 10vw 45vw;
	grid-template-rows: 100vh;
	margin: 0px;
	background: black;
	touch-action: none;
}

#screen_left {
	grid-area: 1/1/2/2;
	display: grid;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	border: solid saddlebrown;
	background: tan;
}
#screen_right {
	grid-area: 1/3/2/4;
	display: grid;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	border: solid skyblue;
	background: blue;
}
#screen_right div {
	transform-origin: center;
	transform: rotate(-90deg);
}
#screen_left div {
	transform-origin: center;
	transform: rotate(90deg);
}
#maze {
	display: grid;
	grid-template-columns: 1fr;
	grid-template-rows: 1fr;
	box-sizing: border-box;
	border: solid;
	background: tan;
}
#controls {
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	grid-template-rows: repeat(2, 1fr);
	gap: 3vh;
	align-items: center;
	justify-content: center;
}
button {
	font-size: 3vh;
	height: 100%;
	aspect-ratio: 1/1;
}
#button_straight {
	grid-area: 1/2/2/3;
}
#button_left {
	grid-area: 2/1/3/2;
}
#button_back {
	grid-area: 2/2/3/3;
}
#button_right {
	grid-area: 2/3/3/4;
}
		</style>
		<script src="MazeLib.js"></script>
	</head>
	<body>
<div id="screen_left">
	<div id="maze">
		<canvas id="canvas_maze">Maze</canvas>
	</div>
</div>
<div id="screen_right">
	<div id="controls">
		<button id="button_straight" class="moveButton">&uarr; <br> Go<br>Straight</button>
		<button id="button_left" class="moveButton">&larr; <br> Turn<br>Left</button>
		<button id="button_back" class="moveButton">&darr; <br> Turn<br>Around</button>
		<button id="button_right" class="moveButton">&rarr; <br> Turn<br>Right</button>
	</div>
</div>
	</body>
	<script>
class School {
	#tiles;
	#goal;
	#student;
	#isWon = false;

	constructor() {
		let tiles = new Maze(4, 3).tiles();
		let cropped = [];
		let halls = [];
		let walls = [];
		for (let y=1; y<tiles.length-1; y++) {
			let row = tiles[y].slice(1,tiles[y].length-1);
			cropped.push(row);
			row.forEach(function (tile, x) {
				if (tile === 0) {
					walls.push({"x": x, "y": y-1});
				}
				if (tile === 1) {
					halls.push({"x": x, "y": y-1});
				}
			});
		}
		this.#tiles = cropped;
		// pick a random hall and wall and make sure they are
		// sufficiently far apart to be fun
		while (true) {
			let hall = halls[Math.floor(Math.random()*halls.length)];
			let wall = walls[Math.floor(Math.random()*walls.length)];
			if (this.#isGoodDistance(hall, wall)) {
				this.#goal = {
					"x": wall.x,
					"y": wall.y
				}
				//pick a valid direction for the student to face
				let validFacingNumbers = [];
				if (this.#canFace(hall.x, hall.y, 0)) {validFacingNumbers.push(0)};
				if (this.#canFace(hall.x, hall.y, 1)) {validFacingNumbers.push(1)};
				if (this.#canFace(hall.x, hall.y, 2)) {validFacingNumbers.push(2)};
				if (this.#canFace(hall.x, hall.y, 3)) {validFacingNumbers.push(3)};
				this.#student = {
					"x": hall.x,
					"y": hall.y,
					//0 is north, 1 east, 2 south, 3 weast
					"facing": validFacingNumbers[Math.floor(Math.random()*validFacingNumbers.length)]
				}
				break;
			}
		}
		console.log("GOAL:", this.#goal, ", STUDENT:", this.#student);
	}

	#isGoodDistance(a, b) {
		const dx = Math.abs(a.x - b.x);
		const dy = Math.abs(a.y - b.y);
		return dx+dy>4;
	}

	#isHall(x, y) {
		return (x === this.#goal.x && y === this.#goal.y) || ( //win condition
			x >= 0 &&
			y >= 0 &&
			y < this.#tiles.length &&
			x < this.#tiles[y].length &&
			y >= 0 &&
			this.#tiles[y][x] === 1
		); //1 means its a hall, 0 means its a wall
	}

	#canFace(x, y, a) { //a is 0, 1, 2, or 3 see above
		if (a === 0 && y-1 >= 0) {
			return this.#tiles[y-1][x] === 1; //meaning the tile to the north of x,y is a hall not a wall
		}
		if (a === 1 && x+1 < this.#tiles[y].length) {
			return this.#tiles[y][x+1] === 1;
		}
		if (a === 2 && y+1 < this.#tiles.length) {
			return this.#tiles[y+1][x] === 1;
		}
		if (a === 3 && x-1 >= 0) {
			return this.#tiles[y][x-1] === 1;
		}
	}
	
	moveStraight() {
		if (this.#isWon) {
			return;
		}
		let x = this.#student.x;
		let y = this.#student.y;
		let a = this.#student.facing;
		if (a === 0 && this.#isHall(x, y-1) && this.#isHall(x, y-2)) {
			this.#student.y -= 1;
		} else if (a === 1 && this.#isHall(x+1, y) && this.#isHall(x+2, y)) {
			this.#student.x += 1;
		} else if (a === 2 && this.#isHall(x, y+1) && this.#isHall(x, y+2)) {
			this.#student.y += 1;
		} else if (a === 3 && this.#isHall(x-1, y) && this.#isHall(x-2, y)) {
			this.#student.x -= 1;
		}
		this.#swapSidesOnGoal();
		this.render();
	}

	turnRight() {
		if (this.#isWon) {
			return;
		}
		let x = this.#student.x;
		let y = this.#student.y;
		let a = this.#student.facing;
		if (a === 0 && this.#isHall(x, y-1) && this.#isHall(x+1, y-1)) {
			this.#student.y -= 1;
			this.#student.facing += 1;
		} else if (a === 1 && this.#isHall(x+1, y) && this.#isHall(x+1, y+1)) {
			this.#student.x += 1;
			this.#student.facing += 1;
		} else if (a === 2 && this.#isHall(x, y+1) && this.#isHall(x-1, y+1)) {
			this.#student.y += 1;
			this.#student.facing += 1;
		} else if (a === 3 && this.#isHall(x-1, y) && this.#isHall(x-1, y-1)) {
			this.#student.x -= 1;
			this.#student.facing += 1;
		}
		this.#student.facing = this.#student.facing%4; //to keep it from getting big
		this.#swapSidesOnGoal();
		this.render();
	}

	turnLeft() {
		if (this.#isWon) {
			return;
		}
		let x = this.#student.x;
		let y = this.#student.y;
		let a = this.#student.facing;
		if (a === 0 && this.#isHall(x, y-1) && this.#isHall(x-1, y-1)) {
			this.#student.y -= 1;
			this.#student.facing -= 1;
		} else if (a === 1 && this.#isHall(x+1, y) && this.#isHall(x+1, y-1)) {
			this.#student.x += 1;
			this.#student.facing -= 1;
		} else if (a === 2 && this.#isHall(x, y+1) && this.#isHall(x+1, y+1)) {
			this.#student.y += 1;
			this.#student.facing -= 1;
		} else if (a === 3 && this.#isHall(x-1, y) && this.#isHall(x-1, y+1)) {
			this.#student.x -= 1;
			this.#student.facing -= 1;
		}
		this.#student.facing = (this.#student.facing+4)%4; //to keep it from going under 0
		this.#swapSidesOnGoal();
		this.render();
	}

	turnAround() {
		if (this.#isWon) {
			return;
		}
		let x = this.#student.x;
		let y = this.#student.y;
		let a = this.#student.facing;
		if (a === 0 && (
				this.#isHall(x, y+1) ||
				this.#isHall(x+1, y) ||
				this.#isHall(x-1, y)
			)
		) {
			this.#student.y -= 1;
			this.#student.facing += 2;
		} else if (a === 1 && (
				this.#isHall(x-1, y) ||
				this.#isHall(x, y+1) ||
				this.#isHall(x, y-1)
			)
		) {
			this.#student.x += 1;
			this.#student.facing += 2;
		} else if (a === 2 && (
				this.#isHall(x, y-1) ||
				this.#isHall(x+1, y) ||
				this.#isHall(x-1, y)
			)
		) {
			this.#student.y += 1;
			this.#student.facing += 2;
		} else if (a === 3 && (
				this.#isHall(x+1, y) ||
				this.#isHall(x, y+1) ||
				this.#isHall(x, y-1)
			)
		) {
			this.#student.x -= 1;
			this.#student.facing += 2;
		}
		this.#student.facing = this.#student.facing%4; //to keep it from getting big
		this.#swapSidesOnGoal();
		this.render();
	}

	#swapSidesOnGoal() {
		if (this.#student.facing === 0) {
			if (this.#student.x === this.#goal.x && this.#student.y-1 === this.#goal.y) {
				this.#isWon = true;
				console.log("WIN!");
			}
		} else if (this.#student.facing === 1) {
			if (this.#student.x+1 === this.#goal.x && this.#student.y === this.#goal.y) {
				this.#isWon = true;
				console.log("WIN!");
			}
		} else if (this.#student.facing === 2) {
			if (this.#student.x === this.#goal.x && this.#student.y+1 === this.#goal.y) {
				this.#isWon = true;
				console.log("WIN!");
			}
		} else if (this.#student.facing === 3) {
			if (this.#student.x-1 === this.#goal.x && this.#student.y === this.#goal.y) {
				this.#isWon = true;
				console.log("WIN!");
			}
		}
		if (this.#isWon) {
			divLeft.style.background = "lime";
			divRight.style.background = "lime";
			setTimeout(function () {
				divLeft.style.background = "";
				divRight.style.background = "";
				let tmp = divRight.removeChild(divRight.firstElementChild);
				let tmp2 = divLeft.removeChild(divLeft.firstElementChild);
					console.log(tmp, tmp2);
				divRight.appendChild(tmp2);
				divLeft.appendChild(tmp);
				school = new School();
				school.render();
			}, 2000);
		}
	}

	render() {
		let canvas = document.getElementById("canvas_maze");
		let context = canvas.getContext("2d");
		for (let y=0; y<this.#tiles.length; y++) {
			//console.log(this.#tiles[y].join(""));
		}
		canvas.width = window.innerHeight*.8;
		canvas.height = canvas.width*5/7;
		const TILE_SIZE = canvas.width/7;
		//render walls
		for (let y=0; y<this.#tiles.length; y++) {
			for (let x=0; x<this.#tiles[y].length; x++) {
				let tile = this.#tiles[y][x];
				if (tile == "0") {
					context.save();
					context.scale(TILE_SIZE, TILE_SIZE);
					context.translate(x, y);
					context.fillRect(0, 0, 1, 1);
					context.restore();
				}
			}
		}
		//render student and goal
		context.save();
		context.scale(TILE_SIZE, TILE_SIZE);
			context.save();
				context.translate(this.#student.x+.5, this.#student.y+.5);
				context.rotate(Math.PI/2*this.#student.facing);
				context.fillStyle = "hotpink";
				context.beginPath();
				context.arc(0, -.5, .4, 0, Math.PI*2);
				context.closePath();
				context.fill();
				context.beginPath();
				context.moveTo(-.25, -.5);
				context.lineTo(0, -1.2);
				context.lineTo(.25, -.5);
				context.fill();
			context.restore();
			context.save();
				context.translate(this.#goal.x, this.#goal.y);
				context.fillStyle = "lime";
				context.fillRect(0, 0, 1, 1);
			context.restore();
		context.restore();
	}
}

const divLeft = document.getElementById("screen_left");
const divRight = document.getElementById("screen_right");
const divMaze = document.getElementById("maze");
const divControls = document.getElementById("controls");
const buttonStraight = document.getElementById("button_straight");
const buttonRight = document.getElementById("button_right");
const buttonLeft = document.getElementById("button_left");
const buttonBack = document.getElementById("button_back");
let school = new School();
school.render();

addEventListener("resize", function () {
	school.render();
});
buttonStraight.addEventListener("click", function (ev) {
	school.moveStraight();
});
buttonRight.addEventListener("click", function (ev) {
	school.turnRight();
});
buttonLeft.addEventListener("click", function (ev) {
	school.turnLeft();
});
buttonBack.addEventListener("click", function (ev) {
	school.turnAround();
});
	</script>
</html>
