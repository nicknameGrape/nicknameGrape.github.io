<!DOCTYPE html>
	<head>
		<meta charset="utf-8">
		<title>Ondoku</title>
		<link rel="icon" type="image/png" href="/favicon.png">
		<style>
@font-face {
    font-family: 'MEXT';
    src: url('../../fonts/mext.otf') format("opentype");
}
body {
	display: grid;
	grid-template-rows: 10vh 50vh 40vh;
	margin: 0px;
}
#top {
	display: flex;
	align-items: center;
	justify-content: space-between;
	background: pink;
	font-size: 18pt;
	gap: 20px;
	padding: 20px;
	box-sizing: border-box;
}
#filters {
	display: grid;
	grid-template: auto auto/auto auto;
	justify-items: end;
}
#inputExampleWordCount {
	font-size: 18pt;
	width: 3em;
}
#inputEntries {
	background: black;
	color: white;
	text-align: end;
}
#inputEntries {
	font-size: 18pt;
	width: 3em;
}
#quiz {
	display: flex;
	flex-direction: column;
}
#quiz_img {
	display: block;
	object-fit: contain;
	height: 50vh;
	aspect-ratio: 1/1;
}
#quiz_example {
	display: flex;
	justify-content: center;
	background: orange;
	font-size: 10vh;
	font-family: "mext";
	height: 40vh;
}
.quiz_word {
	background: skyblue;
	font-size: 10vh;
	font-family: "mext";
}
#next {
	position: absolute;
	right: 20px;
	top: 15vh;
	width: 10vw;
	height: 50vh;
}
		</style>
	</head>
	<body>
		<div id="top">
			<span id="title">Picture Dictionary</span>
			<div id="filters">
				<!--
				<label for="inputExampleWordCount">Max Word Count:</label>
				<input type="number" id="inputExampleWordCount" min="1" value="1"></input>
				<label for="inputEntries">Entries:</label>
				<input type="number" id="inputEntries" readonly></input>
				-->
			</div>
			<!-- 
			<span><input type="checkbox" id="inputToggleQuizMode"></input><label for="inputToggleQuizMode">Quiz Mode</label></span>
			-->
		</div>
		<div id="quiz">
			<img id="quiz_img"/>
			<pre id="quiz_example">Example</pre>
		</div>
		<button id="next">Next</button>
	</body>
	<script type="module">
import pd from "../../image_library/pd_eastman/pd_eastman.json" with { type: 'json' };
import HatDraw from "../js_modules/HatDraw.mjs";
import Loader from "../js_modules/Loader.mjs";

class Quiz {
	constructor(imgSrc, word, example) {
		let img = LOADER.newImageAsset(imgSrc);
		let tagged = example.replace(/\*(\w+)+/g, "<span class='quiz_word'>"+"$1"+"</span>");
		this.img = img;
		this.word = word;
		//document.getElementById("quiz_word").innerHTML = word;
		document.getElementById("quiz_img").src = img.src;
		if (typeof(example) !== "undefined") {
			this.example = example;
			document.getElementById("quiz_example").innerHTML = tagged;
		} else {
			document.getElementById("quiz_example").innerHTML = "";
		}
	}
}

//function filterEntries() {
//	let filtered = pd.filter(function (entry) {
//		let example = entry[2];
//		if (typeof(example) == "undefined") {
//			return entry;
//		} else if (example.split(" ").length == inputExampleWordCount.value) {
//			return entry;
//		}
//	});
//	hd = new HatDraw(filtered);
//	inputEntries.value = filtered.length;
//	setup()
//}

function setup() {
	let draw = hd.drawOne();
	new Quiz(draw[0], draw[1], draw[2]);
}


const LOADER = new Loader("../../image_library/pd_eastman/")
const HD = new HatDraw(pd);
let hd = HD;
const inputExampleWordCount = document.getElementById("inputExampleWordCount");
const inputEntries = document.getElementById("inputEntries");

document.addEventListener("keydown", function (ev) {
	if (
		ev.key === "Enter" ||
		ev.key === " " ||
		ev.key === "ArrowRight"
	) {
		setup();
	}
});

document.getElementById("next").addEventListener("click", setup);

//inputExampleWordCount.addEventListener("change", filterEntries);

//filterEntries();
setup();
	</script>
</html>
