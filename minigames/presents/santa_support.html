body {

	}

	transform-origin: top left; transform: rotate(90deg) translate(0, -48vw);
	width: 100vh; height: 48vw;
}
#elf {
	display: grid; grid-template-columns: 10vh 90vh; grid-template-rows: repeat(2, auto);
	justify-items: center;
	width: 100vh; height: 48vw;
	background: green;
}
#imgElf {grid-area: 1/1/3/2; align-self: end; justify-self: start; width: 20vh;}
#instructions {
	grid-area: 1/1/2/3; display: grid; grid-template-columns: repeat(3, auto); grid-template-rows: repeat(2, auto);
	align-self: end;
	place-items: center; gap: 1vh;
	width: 90vh; height: 15vw;
	box-sizing: border-box; padding: 1vh;
	background: pink;
}
#canvasHouse {width: 40vh; background: gray;}
#imgPresent {width: 15vh; max-height: 10vw;}
#name {font-size: xx-large; font-family: sans-serif;}
#confirm {display: flex; place-items: center; padding-bottom: 5vh;}
.wrapper {grid-area: 2/1/3/2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vw;}
#wrapperHouse {}
#wrapperChoice {display: none;}
#wrapperWriting {display: none;}
#canvasHouseClone {width: 30vh; background: gray;}
#imgChoice {width: 20vh; height: 20vh; border: solid white; object-fit: contain;}
#canvasWritten {width: 40vh; background: beige; border: thick double black;}
.buttonConfirm {font-size: x-large;}
.confirmPresent {}
.confirmWriting {}
#border {background: black;}
#p2 {
	transform-origin: top left; transform: rotate(-90deg) translate(-100vh);
	width: 100vh; height: 48vw;
}
#santa {

	width: 100vh; height: 48vw;
	color: white;
	background: red;
}
#chooseHouse {
	display: grid; grid-template-columns: repeat(2, 45vh); grid-template-rows: 15vw repeat(2, auto); place-items: center;
}
.choiceHouse {
	display: flex; place-items: center; justify-content: center;
	width: 45vh; height: 25vh;
}
.choiceHouse > canvas {
	width: 40vh; height: 20vh; background: gray;
}
.choiceHouse:disabled {
	opacity: 50%;
}
#imgChooseHouse {
	grid-area: 1/1/2/3; justify-self: center; height: 15vw; background: navy;
}
#choosePresent {
	display: none; grid-template-columns: repeat(5, 20vh); grid-template-rows: repeat(2, auto); row-gap: 2vw;

#imgChoosePresent {
	grid-area: 1/1/2/6; justify-self: center; height: 20vw;

.choice {
	justify-self: center;
	display: flex; align-items: center; justify-content: center;
	width: 18vh;
}
.choice:disabled {

.choice > img {
	box-sizing: border-box; padding: 5px;
	width: 15vh;

#writeName {

#imgSantaWriting {

	height: 15vw;

#canvasWriting {
	width: 80vh; height: 30vw;
	box-sizing: border-box; border: thick double black;
	background: beige;

const IMG_HOUSE = LOADER.newImageAsset(IMAGE_LIBRARY.find(o => o.text === "house").src, setup);

function setup() {
	//generate new houses
	let values = []
	choicesHouses.forEach(function (el) {
		let canvas = el.firstChild;
		let context = canvas.getContext("2d");
		let rPlace = LOADER.newImageAsset(hdPlaces.drawOne().src, function () {
			if (LOADER.assetsLoaded) {
				let rPair = this[Math.floor(this.length*Math.random())];
				this.forEach(function (pair) {
					let ctx = pair[0];
					let img = pair[1];
					ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
					fitImage(ctx, img, canvas.width/4, 0, canvas.width*3/4, canvas.height);
					fitImage(ctx, IMG_HOUSE, 0, 0, canvas.width/4, canvas.height);
				});
				contextHouseClone.clearRect(0, 0, canvasHouseClone.width, canvasHouseClone.height);
				contextHouseClone.drawImage(rPair[0].canvas, 0, 0, canvasHouseClone.width, canvasHouseClone.height);
			}
		}.bind(values));
		values.push([context, rPlace]);
	});
	choicesHouses.forEach(button => button.disabled = false);
	divHouse.style.display = "grid";
	buttonsConfirmHouse.forEach(button => button.disabled = true);
	contextHouse.clearRect(0, 0, canvasHouse.width, canvasHouse.height);
	wrapperHouse.style.display = "flex";
	//setup present div
	wrapperChoice.style.display = "none";
	divSearch.style.display = "none";
	buttonsConfirmPresent.forEach(button => button.disabled = true);
	imgChoice.src = ""; //erase default drum image
	choices.forEach(el => el.firstChild.src = hdPresent.drawOne());
	imgPresent.src = hdPresent.drawOne();
	hdChoices.drawOne().firstChild.src = imgPresent.src;
	//setup writing div
	wrapperWriting.style.display = "none";
	spanName.innerHTML = hdName.drawOne();
	divWrite.style.display = "none";
	contextWriting.clearRect(0, 0, canvasWriting.width, canvasWriting.height);
	contextWritten.clearRect(0, 0, canvasWritten.width, canvasWritten.height);
	buttonsConfirmWriting.forEach(button => button.disabled = true);
}

function resizeHander(ev) {
	let rect = canvasWriting.getBoundingClientRect();
	canvasWriting.width = rect.right - rect.left;
	canvasWriting.height = rect.bottom - rect.top;
	console.log(canvasWriting);
}

function housePointerdownHandler(ev) {
	contextHouse.clearRect(0, 0, canvasHouse.width, canvasHouse.height);
	contextHouse.drawImage(ev.target, 0, 0, canvasHouse.width, canvasHouse.height);
	choicesHouses.forEach(button => button.disabled = true);
	buttonsConfirmHouse.forEach(button => button.disabled = false);
}

function choicePointerdownHandler(ev) {
	imgChoice.src = ev.target.src;
	choices.forEach(button => button.disabled = true);
	buttonsConfirmPresent.forEach(button => button.disabled = false);
}

function acceptHouseHandler(ev) {
	choices.forEach(button => button.disabled = false);
	divHouse.style.display = "none";
	wrapperHouse.style.display = "none";
	divSearch.style.display = "grid";
	wrapperChoice.style.display = "flex";
	divWrite.style.display = "none";
	resizeHander();
}

function rejectHouseHandler(ev) {
	contextHouse.clearRect(0, 0, canvasHouse.width, canvasHouse.height);
	choicesHouses.forEach(button => button.disabled = false);
	buttonsConfirmHouse.forEach(button => button.disabled = true);
}

function acceptPresentHandler(ev) {
	buttonsConfirmPresent.forEach(button => button.disabled = true);
	buttonsConfirmWriting.forEach(button => button.disabled = false);
	wrapperChoice.style.display = "none";
	wrapperWriting.style.display = "flex";
	divSearch.style.display = "none";
	divWrite.style.display = "flex";
	resizeHander();
}

function rejectPresentHandler(ev) {
	imgChoice.src = "";
	choices.forEach(button => button.disabled = false);
	buttonsConfirmPresent.forEach(button => button.disabled = true);
}

function acceptWritingHandler(ev) {
	divP1.appendChild(divP2.children[0]);
	divP2.appendChild(divP1.children[0]);
	setup();
}

function rejectWritingHandler(ev) {
	contextWriting.clearRect(0, 0, canvasWriting.width, canvasWriting.height);
	contextWritten.clearRect(0, 0, canvasWritten.width, canvasWritten.height);
}

function canvasTouchHandler(ev) {
	let w = ev.target.width;
	let h = ev.target.height;
	//contextWriting.fillRect(ev.offsetX*w/h, ev.offsetY*h/w, 10, 10);
	contextWriting.beginPath();
	contextWriting.arc(ev.offsetX*w/h, ev.offsetY*h/w, 5, 0, 2*Math.PI);
	contextWriting.fill();
	contextWritten.drawImage(canvasWriting, 0, 0, canvasWritten.width, canvasWritten.height);
}
