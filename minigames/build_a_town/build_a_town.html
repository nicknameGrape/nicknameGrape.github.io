<!DOCTYPE html>
<head>
	<style>
body {
	margin: 0;
	user-select: none;
}
img {
	height: 10vh;
}
#city {
	display: grid;
	grid-template-rows: repeat(4, 25vh);
	grid-template-columns: repeat(5, 20vw);
	background: green;
}
#buildMenu {
	display: none;
	background: black;
	width: 80vw;
	height: 80vh;
	position: absolute;
	top: 10vh;
	left: 10vw;
}
label {
	display: inline-flex;
	align-items: center;
}
#adjectives {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	width: 30%;
	color: white;
	font-size: 5vh;
}
#buildings {
	display: flex;
	flex-direction: column;
	flex-wrap: wrap;
	gap: 3vh;
	background: purple;
	width: 70%;
}
	</style>
</head>
<body>
	<div id="city"></div>
	<div id="buildMenu">
		<div id="adjectives">
			<div>
				<input id="big" type="radio" name="adjective"/>
				<label for="big">big</label>
			</div>
			<div>
				<input id="small" type="radio" name="adjective"/>
				<label for="small">small</label>
			</div>
			<div>
				<input id="new" type="radio" name="adjective"/>
				<label for="new">new</label>
			</div>
			<div>
				<input id="old" type="radio" name="adjective"/>
				<label for="old">old</label>
			</div>
			<div>
				<input id="beautiful" type="radio" name="adjective"/>
				<label for="beautiful">beautiful</label>
			</div>
			<div>
				<input id="famous" type="radio" name="adjective"/>
				<label for="famous">famous</label>
			</div>
			<div>
				<input id="exciting" type="radio" name="adjective"/>
				<label for="exciting">exciting</label>
			</div>
			<div>
				<input id="fantastic" type="radio" name="adjective"/>
				<label for="fantastic">fantastic</label>
			</div>
			<div>
				<input id="cool" type="radio" name="adjective"/>
				<label for="cool">cool</label>
			</div>
		</div>
		<div id="buildings"></div>
	</div>
</body>
<script type="module" src="build_a_town_main.js"></script>
</html>
