<!DOCTYPE html>
<head>
	<style>
body {
	margin: 0;
	user-select: none;
}
img {
	height: 10vh;
}
#city {
	display: grid;
	grid-template-rows: repeat(3, 33.33vh);
	grid-template-columns: repeat(3, 33.33vw);
	background: green;
}
#buildMenu {
	display: none;
	background: black;
	width: 80vw;
	height: 80vh;
	position: absolute;
	top: 10vh;
	left: 10vw;
}
label {
	display: inline-flex;
	align-items: center;
}
#adjectives {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	width: 30%;
	color: white;
	font-size: 5vh;
}
.translation {
	margin-left: 10px;
	font-size: 70%;
	color: gray;
}
#buildings {
	display: flex;
	flex-direction: column;
	flex-wrap: wrap;
	gap: 3vh;
	background: purple;
	width: 70%;
}
	</style>
</head>
<body>
	<div id="city"></div>
	<div id="buildMenu">
		<div id="adjectives">
			<div>
				<input id="big" type="radio" name="adjective" value="big"/>
				<label for="big">big<span class="translation">大きい</span></label>
			</div>
			<div>
				<input id="small" type="radio" name="adjective" value="small"/>
				<label for="small">small<span class="translation">小さい</span></label>
			</div>
			<div>
				<input id="new" type="radio" name="adjective" value="new"/>
				<label for="new">new<span class="translation">新しい</span></label>
			</div>
			<div>
				<input id="old" type="radio" name="adjective" value="old"/>
				<label for="old">old<span class="translation">古い</span></label>
			</div>
			<div>
				<input id="beautiful" type="radio" name="adjective" value="beautiful"/>
				<label for="beautiful">beautiful<span class="translation">美しい</span></label>
			</div>
			<div>
				<input id="famous" type="radio" name="adjective" value="famous"/>
				<label for="famous">famous<span class="translation">有名な</span></label>
			</div>
			<div>
				<input id="exciting" type="radio" name="adjective" value="exciting"/>
				<label for="exciting">exciting<span class="translation">わくわくする</span></label>
			</div>
			<div>
				<input id="fantastic" type="radio" name="adjective" value="fantastic"/>
				<label for="fantastic">fantastic<span class="translation">すばらしい</span></label>
			</div>
			<div>
				<input id="cool" type="radio" name="adjective" value="cool"/>
				<label for="cool">cool<span class="translation">かっこいい</span></label>
			</div>
		</div>
		<div id="buildings"></div>
	</div>
</body>
<script type="module" src="build_a_town_main.js"></script>
</html>
