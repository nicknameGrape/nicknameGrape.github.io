<!DOCTYPE html>
	<head>
		<style>
body {
	background: gray;
	margin: 0;
}
.hidden {
	display: none;
}
#choices {
	display: grid;
	grid-template-rows: repeat(4, calc(25% - 10px));
	grid-template-columns: repeat(4, calc(25% - 10px));
	align-items: center;
	box-sizing: border-box;
	padding: 10px;
	padding-top: 50px;
	gap: 10px;
	width: 100vw;
	height: 100vh;
}
.decisionBox {
	display: grid;
	grid-template-columns: repeat(4, 25%);
	align-items: end;
}
.buttonLike {
	display: flex;
	align-items: center;
	justify-content: center;
	grid-area: 1/1/2/2;
	background: pink;
}
.buttonDont {
	grid-area: 1/4/2/5;
	color: white;
	background: red;
}
.like {
	background: hotpink;
}
.dont {
	background: red;
}
.choice {
	background: tan;
	display: flex;
	box-sizing: border-box;
	padding: 5px;
	width: 100%;
}
img {
	grid-area: 1/1/2/5;
	height: 20vh;
	object-fit: contain;
	justify-self: center;
}
.hidden {
	/*visibility: hidden;*/
	display: none;
}
#sentences {
	display: none;
	grid-template-rows: repeat(3, 33vh);
	grid-template-columns: 25vw 75vw;
	align-items: center;
	font-family: "mext";
	font-size: 48pt;
}
#sentences img {
	height: 30vh;
	object-fit: contain;
	justify-items: center;
	box-sizing: border-box;
	padding: 10px;
	margin-right: 10px;
}
#sentences span {
	padding: 10px;
	justify-self: start;
}
#reset {
	position: absolute;
	top: 10px;
	right: 20px;
	font-size: 16pt;
}
		</style>
	</head>
	<body>
		<div id="choices"></div>
		<div id="sentences"></div>
		<button id="reset">Reset</button>
	</body>
	<script type="module">
//import image_library from "../image_library/image_library.mjs"
import image_library from "https://nicknamegrape.github.io/image_library/image_library.mjs"
//import HatDraw from "../js_modules/HatDraw.mjs"
import HatDraw from "https://nicknamegrape.github.io/minigames/js_modules/HatDraw.mjs"
//console.log(image_library);
function setup() {
	while (divChoices.firstChild) {
		divChoices.removeChild(divChoices.firstChild);
	}
	while (divSentences.firstChild) {
		divSentences.removeChild(divSentences.firstChild);
	}
	for (let i=0;i<N;i++) {
		let decisionBox = document.createElement("div");
		decisionBox.classList.add("decisionBox");
		let buttonLike = document.createElement("button");
		buttonLike.innerHTML = "❤<br>Like";
		buttonLike.classList.add("buttonLike");
		let buttonDont = document.createElement("button");
		buttonDont.innerHTML = "X<br>Don't Like";
		buttonDont.classList.add("buttonDont");
		let img = document.createElement("img");
		//let ilo = image_library[Math.floor(Math.random()*image_library.length)];
		//let ilo = ilFiltered.splice([Math.floor(Math.random()*ilFiltered.length)], 1)[0];
		let ilo = hatdraw.drawOne();
		console.log(ilo);
		img.src = PATH2IMAGES + ilo.src;
		img.il_data = ilo;
		img.classList.add("choice");
		decisionBox.append(img);
		decisionBox.append(buttonLike);
		decisionBox.append(buttonDont);
		divChoices.appendChild(decisionBox);
	}
	divSentences.classList.add("hidden");
}
//const PATH2IMAGES = "/image_library/images/";
const PATH2IMAGES = "https://nicknamegrape.github.io/image_library/images/";
//const N = 20;
const N = 16;
//const N = 9;
const divChosen = document.getElementById("chosen");
const divChoices = document.getElementById("choices");
const divLike = document.getElementById("like");
const divDont = document.getElementById("dont");
const divSentences = document.getElementById("sentences");
const tags = ["food", "fruit", "animal", "color", "drink", "sport", "vegetable", "monster", "vehicle", "entertainment"];
const BLACKLIST = ["pet"];
let dragged = null;
let ilFiltered = image_library.filter(function (o) {
	return o.tags.some(function (t) {return tags.includes(t);}) &&
	!BLACKLIST.includes(o.text);
	//return o;
});
const hatdraw = new HatDraw(ilFiltered);
console.log(ilFiltered);
setup();

window.addEventListener("keydown", function (ev) {
	if (ev.key === "n") {
		setup();
	}
});
document.getElementById("reset").addEventListener("click", function (ev) {
	setup();
});
	</script>
</html>
