These books are from the website ReadingA-Z and my own collection of picture books for children.<br>
Those from ReadingA-Z will be the easiest for beginning readers.<br>
The Apricot books ("A Beautiful Butterfly" and "Tiny Boppers") are good for reading to a young class and lend themselves to activities.<br>
The Schade/Buller books are my favorites!
		</p>

function addBook(book) {
	let divLibrary = document.getElementById("library");
	let figure = document.createElement("figure");
	let anchor = document.createElement("a");
	let img = document.createElement("img");
	figure.classList.add("book");
	anchor.href = book.pdf;
	img.src = book.coverImg;
	figure.appendChild(anchor);
	anchor.appendChild(img);
	divLibrary.appendChild(figure);
}
